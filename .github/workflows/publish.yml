name: publish

# Publishes the plugin (main package + all per-platform packages) to npm when a
# version tag is pushed, e.g. `git tag v0.5.0 && git push origin v0.5.0`.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN is stored anywhere. GitHub's
# short-lived OIDC identity authenticates each `npm publish`, so there is nothing
# to rotate. This requires, ONE TIME (see docs/PUBLISHING.md):
#   - `permissions: id-token: write` (below),
#   - npm >= 11.5.1 (upgraded below; Node 22 ships npm 10.x),
#   - a Trusted Publisher configured on npmjs.com for EACH published package
#     (the main package + the 8 platform packages) pointing at this repo + this
#     workflow file.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG — bump package.json (+ CHANGELOG) before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build bundle (cross-compiles all platform targets)
        run: npm run bundle

      # cui runs `npm publish` for the main package + each platform package.
      # With id-token: write + npm >= 11.5 + Trusted Publishers configured, each
      # publish authenticates via OIDC (no token) and emits a provenance
      # attestation. `--yes` skips the interactive confirmation.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npx --no-install cui publish --latest --yes
