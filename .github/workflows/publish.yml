name: publish

# Publishes the plugin (main package + all per-platform packages) to npm when a
# version tag is pushed, e.g. `git tag v0.5.0 && git push origin v0.5.0`.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN is stored anywhere. GitHub's
# short-lived OIDC identity authenticates each `npm publish`, so there is nothing
# to rotate. This requires, ONE TIME (see docs/PUBLISHING.md):
#   - `permissions: id-token: write` (below),
#   - npm >= 11.5.1 (upgraded below; Node 22 ships npm 10.x),
#   - a Trusted Publisher configured on npmjs.com for EACH published package
#     (the main package + the 8 platform packages) pointing at this repo + this
#     workflow file.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build + cross-compile + bundle, but do NOT publish to npm.'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG — bump package.json (+ CHANGELOG) before tagging."
            exit 1
          fi

      - name: Verify CHANGELOG has an entry for this version
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          ESC="$(printf '%s' "$VER" | sed 's/[.]/\\./g')"
          if ! grep -qE "^## \[?${ESC}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VER}]' entry — update the changelog before releasing."
            exit 1
          fi
          echo "CHANGELOG entry for ${VER} found."

      - name: Install dependencies
        run: npm ci

      - name: Build bundle (cross-compiles all platform targets)
        run: npm run bundle

      # A manual dry run stops here — the build + cross-compile + bundle having
      # succeeded is the point of the dry run; nothing is published.
      - name: Dry run — skipping publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Dry run: build, cross-compile, and bundle succeeded. Not publishing."

      # cui runs `npm publish` for the main package + each platform package.
      # With id-token: write + npm >= 11.5 + Trusted Publishers configured, each
      # publish authenticates via OIDC (no token) and emits a provenance
      # attestation. `--yes` skips the interactive confirmation. Runs on a tag
      # push, or a manual run with dry_run unchecked.
      - name: Publish to npm (Trusted Publishing / OIDC)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: npx --no-install cui publish --latest --yes
